<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sun body with gradient -->
  <defs>
    <radialGradient id="sunGradient" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#ffeb99;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sun glow -->
  <circle cx="50" cy="50" r="35" fill="#ff9500" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Sun core -->
  <circle cx="50" cy="50" r="28" fill="url(#sunGradient)" filter="url(#glow)"/>
  
  <!-- Highlight on sun -->
  <circle cx="42" cy="42" r="8" fill="#ffff99" opacity="0.6"/>
  
  <!-- Orbital rings -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.4" stroke-dasharray="5,3"/>
  <circle cx="50" cy="50" r="55" fill="none" stroke="#ff6b9d" stroke-width="1.5" opacity="0.3" stroke-dasharray="5,3"/>
  
  <!-- Small planet on orbit -->
  <circle cx="92" cy="50" r="4" fill="#4db8ff"/>
</svg>